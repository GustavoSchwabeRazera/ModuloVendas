services:
  - type: web
    name: exportai-modulo-vendas
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: GEMINI_API_KEY
        sync: false
      - key: EXPORTAI_CORS_ORIGINS
        sync: false
      - key: EXPORTAI_GEMINI_MODEL
        value: gemini-3.6-flash
      - key: HUNTER_API_KEY
        sync: false
      - key: EXPORTAI_HUNTER_ATIVO
        value: true
      - key: EXPORTAI_DADOS_TARIFARIOS_ATIVOS
        value: true
      - key: EXPORTAI_VALIDACAO_LEADS_ATIVA
        value: false
